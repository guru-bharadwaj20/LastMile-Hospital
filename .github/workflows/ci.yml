name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref rather than queueing them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dashboard:
    name: Dashboard (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lastmile
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: lastmile/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Upload build output
        if: matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: lastmile/dist
          retention-days: 7

  sdn:
    name: SDN layer (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SDN_files
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is what the Ryu controller runs on; 3.12 confirms the pure
        # topology and flow-table modules stay free of that constraint.
        python: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: SDN_files/requirements-dev.txt

      - name: Install
        # Deliberately dev requirements only. topology.py and flow_table.py
        # are pure Python, so the forwarding table is verified without Ryu,
        # Mininet, Open vSwitch, or root.
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest
