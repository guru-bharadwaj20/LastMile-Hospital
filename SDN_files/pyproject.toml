[tool.pytest.ini_options]
# topology.py and flow_table.py sit alongside the Ryu app rather than in a
# package, because ryu-manager loads the controller by file path.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
