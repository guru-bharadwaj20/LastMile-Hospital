name: Deploy dashboard to GitHub Pages

# Manual by default. Uncomment the push trigger once Pages is enabled in
# Settings -> Pages -> Source: GitHub Actions.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths: ['lastmile/**', '.github/workflows/deploy.yml']

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Queued rather than cancelled, so a run that is
# already publishing is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lastmile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lastmile/package-lock.json

      - run: npm ci

      # The same gates CI applies. A deploy should not be able to publish
      # something that would have failed a pull request.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

      - name: Build
        env:
          # Project sites live under /<repo>/, not the domain root.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      # Without this, Pages runs Jekyll and silently drops any path segment
      # beginning with an underscore.
      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: lastmile/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
