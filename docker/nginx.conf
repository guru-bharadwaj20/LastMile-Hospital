server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: unknown paths fall back to the entry point rather than
    # 404, so ?mode=live and any future routes resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames, so they are safe to cache indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The entry point must never be cached, or a deploy leaves browsers
    # requesting asset hashes that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
}
